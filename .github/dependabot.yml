version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The dedicated uv ecosystem (GA since 2025-03) updates pyproject.toml +
  # uv.lock together; the legacy "pip" entry ignored the lockfile.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
