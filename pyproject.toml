[project]
name = "octo-updater"
version = "1.2.0"
description = "Standalone updater and mod manager for the OctoWoW client"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
