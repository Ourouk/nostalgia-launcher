[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octo-updater"
version = "1.2"
description = "Standalone updater and mod manager for the OctoWoW client"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
octo-updater = "octo_updater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/octo_updater"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
