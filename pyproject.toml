[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nostalgia-launcher"
version = "0.0.2"
description = "Standalone updater and mod manager for the Vanilla WoW client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    # certifi supplies a current CA bundle so TLS verification works even on
    # platforms with a stale/incomplete system root store (e.g. Windows).
    "certifi>=2024.0",
    "pydantic>=2.8",
    "platformdirs>=4.2",
    "filelock>=3.15",
    "httpx>=0.28",
    "tenacity>=9.0",
    "packaging>=24.0",
    # libtorrent only ships wheels for CPython 3.10-3.13; on newer
    # interpreters the client update path degrades to per-file HTTP
    # downloads (services/update_backend/torrent_update.available()).
    "libtorrent; python_version < '3.14'",
]

[project.scripts]
nostalgia-launcher = "nostalgia_launcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nostalgia_launcher"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.15",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: requires the real WoW client (context/client) and torrent (context/wow-client.torrent); local-only, skipped in CI",
]

[tool.ruff]
# Match the codebase's existing pep8-style 79-column wrapping.
line-length = 79
target-version = "py312"
exclude = ["dist", "build"]

[tool.ruff.lint]
# Core correctness (E4/E7/E9/F) plus import sorting, whitespace nits and the
# low-risk modernisations (UP) / bugbear (B) rule families.
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src/nostalgia_launcher"]
# UI excluded: PySide6 stubs are incomplete (317 attribute errors at
# standard) — genuinely untyped external boundary, isolated per task
# guidance. Core/services/controllers/state are strictly checked; ui would
# require vendored stubs. Re-enable when PySide6 ships py.typed.
exclude = ["packaging", "context", "tests", "src/nostalgia_launcher/ui"]
# Standard+ hardening: fail on missing imports/stubs so third-party
# dependencies (PySide6, libtorrent, certifi, future libs) must be declared
# and typed. Verified 0 errors with ui excluded; strict on this subset is
# 3149 errors — promote to strict per-module via overrides once annotated.
reportMissingImports = true
reportMissingTypeStubs = true
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
