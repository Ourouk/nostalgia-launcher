[project]
name = "octo-updater"
version = "1.2.0"
description = "Standalone updater and mod manager for the OctoWoW client"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not qt_legacy'"
markers = [
    "qt_legacy: legacy Tk smoke suite, opt-in (excluded from the default run)",
]
