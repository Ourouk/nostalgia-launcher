[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vanilla-wow-launcher"
version = "1.3"
description = "Standalone updater and mod manager for the Vanilla WoW client"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
vanilla-wow-launcher = "vanilla_wow_launcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vanilla_wow_launcher"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
